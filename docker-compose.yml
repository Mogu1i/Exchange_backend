services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "1.0.0"
    environment:
      APP_NAME: "CurrencyExchangeApp"
      APP_PORT: ":3000"
      DB_DSN: "root:password@tcp(mysql:3306)/test?charset=utf8mb4&parseTime=True&loc=Local"
      DB_MAX_IDLE_CONNS: "10"
      DB_MAX_OPEN_CONNS: "100"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      CONFIG_PATH: "/app/config/config.yml"
      APP_VERSION: "1.0.0"
    labels:
      org.opencontainers.image.title: "exchangeapp"
      org.opencontainers.image.version: "1.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_DATABASE: "test"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

volumes:
  mysql_data:
